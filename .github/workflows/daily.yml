name: Tender Town pipeline

on:
  schedule:
    # Every 4 hours, the Teams cadence. run_daily.py skips the tick unless the
    # fastest paying plan (owner accounts excluded) is due. No paid plan: once a day.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

# The last step commits the digest back to the repo.
permissions:
  contents: write

concurrency:
  group: tender-town-pipeline
  cancel-in-progress: false

jobs:
  daily-run:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run daily discovery + triage + digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PIPELINE_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          python run_daily.py

      - name: Upload digest as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest-${{ github.run_number }}
          path: reports/daily/*.md
          retention-days: 90

      - name: Commit digest to repo
        if: success()
        run: |
          git config --global user.name "tender-town-bot"
          git config --global user.email "actions@github.com"
          git add reports/daily/*.md
          git diff --staged --quiet || git commit -m "Daily digest: $(date +%Y-%m-%d)"
          git push
